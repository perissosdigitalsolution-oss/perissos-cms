# docker-compose.yml - Perissos CMS
# Usage:
#   Development (fast, HMR):  docker compose --profile dev up -d
#   Production (built image): docker compose --profile prod up -d --build
#   Default (infra only):     docker compose up -d postgres minio

services:
  # ─── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: perissos-postgres
    environment:
      POSTGRES_DB: perissos_dev
      POSTGRES_USER: perissos
      POSTGRES_PASSWORD: perissos_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perissos -d perissos_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-compatible) ────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: perissos-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: perissos
      MINIO_ROOT_PASSWORD: perissos_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ─── MinIO Bucket Setup ──────────────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: perissos-minio-setup
    profiles: ["dev"]
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 perissos perissos_minio_password;
      mc mb -p local/perissos-media;
      mc anonymous set public local/perissos-media;
      echo 'MinIO bucket created and configured';
      "

  # ─── Backoffice DEV (fast iteration, HMR) ────────────────
  backoffice-dev:
    image: node:20-alpine
    container_name: perissos-backoffice-dev
    profiles: ["dev"]
    working_dir: /app
    environment:
      NODE_ENV: development
      HOSTNAME: "0.0.0.0"
      PAYLOAD_SECRET: dev_secret_change_in_production_min_32_chars
      DATABASE_URL: postgresql://perissos:perissos_dev_password@postgres:5432/perissos_dev
      R2_ENDPOINT: http://minio:9000
      R2_BUCKET: perissos-media
      R2_ACCESS_KEY_ID: perissos
      R2_SECRET_ACCESS_KEY: perissos_minio_password
      R2_PUBLIC_URL: http://localhost:9000/perissos-media
      R2_PREFIX: dev/
      NEXT_PUBLIC_CMS_URL: http://localhost:3000
      NEXT_PUBLIC_FRONTEND_URL: http://localhost:3001
      NEXT_PUBLIC_R2_URL: http://localhost:9000/perissos-media/dev
      PREVIEW_SECRET: dev_preview_secret_change_in_production
      CRON_SECRET: dev_cron_secret
      STRIPE_SECRET_KEY: sk_test_your_stripe_key
      STRIPE_WEBHOOK_SECRET: whsec_your_webhook_secret
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_your_stripe_key
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - .:/app
      - backoffice_node:/app/node_modules
      - backoffice_next:/app/apps/backoffice/.next
    command: sh -c "corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile && pnpm --filter backoffice dev:host"

  # ─── Backoffice PROD (built image) ───────────────────────
  backoffice:
    build:
      context: .
      dockerfile: apps/backoffice/Dockerfile
      target: runner
    container_name: perissos-backoffice
    profiles: ["prod"]
    environment:
      NODE_ENV: production
      PAYLOAD_SECRET: dev_secret_change_in_production_min_32_chars
      DATABASE_URL: postgresql://perissos:perissos_dev_password@postgres:5432/perissos_dev
      R2_ENDPOINT: http://minio:9000
      R2_BUCKET: perissos-media
      R2_ACCESS_KEY_ID: perissos
      R2_SECRET_ACCESS_KEY: perissos_minio_password
      R2_PUBLIC_URL: http://localhost:9000/perissos-media
      R2_PREFIX: dev/
      NEXT_PUBLIC_CMS_URL: http://localhost:3000
      NEXT_PUBLIC_FRONTEND_URL: http://localhost:3001
      NEXT_PUBLIC_R2_URL: http://localhost:9000/perissos-media/dev
      PREVIEW_SECRET: dev_preview_secret_change_in_production
      CRON_SECRET: dev_cron_secret
      STRIPE_SECRET_KEY: sk_test_your_stripe_key
      STRIPE_WEBHOOK_SECRET: whsec_your_webhook_secret
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_your_stripe_key
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ─── Frontend DEV (fast iteration, HMR) ──────────────────
  frontend-dev:
    image: node:20-alpine
    container_name: perissos-frontend-dev
    profiles: ["dev"]
    working_dir: /app
    environment:
      NODE_ENV: development
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_CMS_URL: http://localhost:3000
      NEXT_PUBLIC_R2_URL: http://localhost:9000/perissos-media/dev
    ports:
      - "3001:3001"
    depends_on:
      - backoffice-dev
    volumes:
      - .:/app
      - frontend_node:/app/node_modules
      - frontend_next:/app/apps/frontend/.next
    command: sh -c "corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile && pnpm --filter frontend dev:host"

  # ─── Frontend PROD (built image) ─────────────────────────
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_CMS_URL: http://localhost:3000
    container_name: perissos-frontend
    profiles: ["prod"]
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_CMS_URL: http://localhost:3000
      NEXT_PUBLIC_R2_URL: http://localhost:9000/perissos-media/dev
    ports:
      - "3001:80"
    depends_on:
      - backoffice

  # ─── Onlook AI Visual Editor (Evaluation) ─────────────────────
  # Supabase (minimal - just PostgreSQL + PostgREST for evaluation)
  supabase-db:
    image: postgres:15-alpine
    container_name: perissos-supabase-db
    profiles: ["onlook"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - supabase_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgREST for Supabase REST API
  supabase-rest:
    image: postgrest/postgrest:v12.2.0
    container_name: perissos-supabase-rest
    profiles: ["onlook"]
    environment:
      PGRST_DB_URI: postgresql://postgres:postgres@supabase-db:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
    depends_on:
      - supabase-db
    ports:
      - "3004:3000"

  # Onlook Studio - dev mode (bun dev)
  onlook:
    image: oven/bun:1
    container_name: perissos-onlook
    profiles: ["onlook"]
    working_dir: /app/onlook
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@supabase-db:5432/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://supabase-rest:3000
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1cGFiYXNlIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTczNTY4OTYwMCwiZXhwIjoyMDUxMjY1NjAwfQ.Ej8Ej8Ej8Ej8Ej8Ej8Ej8Ej8Ej8Ej8Ej8Ej8Ej8Ej8
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      CODESANDBOX_API_KEY: ${CODESANDBOX_API_KEY}
      NEXT_PUBLIC_ONLOOK_URL: http://localhost:3002
      ONLOOK_PROJECT_PATH: /app/projects/perissos-frontend
      # Required env vars for Onlook
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1cGFiYXNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzU2ODk2MDAsImV4cCI6MjA1MTI2NTYwMH0.Ej8Ej8Ej8Ej8Ej8Ej8Ej8Ej8Ej8Ej8Ej8Ej8Ej8Ej8
      SUPABASE_URL: http://supabase-rest:3000
      OPENAI_API_KEY: ${OPENROUTER_API_KEY}
      CSB_API_KEY: ${CODESANDBOX_API_KEY:-dummy-csb-key}
      SUPABASE_DATABASE_URL: postgresql://postgres:postgres@supabase-db:5432/postgres
    ports:
      - "3002:3000"
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started
    volumes:
      - ./onlook:/app/onlook
      - .:/app/projects/perissos-frontend
      - onlook_data:/app/.onlook
    command: sh -c "cd /app/onlook && bun install --frozen-lockfile && bun run dev"
    mem_limit: 2g
    cpus: 1


# ─── Database Admin (Optional) ───────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: perissos-pgadmin
    profiles: ["dev"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@perissos.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  minio_data:
  pgadmin_data:
  backoffice_node:
  backoffice_next:
  frontend_node:
  frontend_next:
  supabase_data:
  onlook_data:

networks:
  default:
    name: perissos-network
