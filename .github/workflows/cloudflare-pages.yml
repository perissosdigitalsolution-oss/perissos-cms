name: Deploy Frontend to Cloudflare
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install -g pnpm@9.15.0 && pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm turbo build --filter=frontend
        env:
          NEXT_PUBLIC_CMS_URL: https://cms.perissos.digital
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@3.90.0 pages deploy apps/frontend/out --project-name perissos-frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c51dde59d5bd84ed96f9ad779feb9ed6
