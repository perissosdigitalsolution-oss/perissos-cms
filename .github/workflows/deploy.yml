name: Deploy to Railway

on:
  push:
    branches: [main, sprint/*]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backoffice
        run: |
          docker build -t ghcr.io/perissosdigitalsolution-oss/backoffice:latest -f apps/backoffice/Dockerfile --target runner .
          docker push ghcr.io/perissosdigitalsolution-oss/backoffice:latest
      - name: Trigger Railway redeploy
        run: |
          curl -s -X POST https://backoffice.railway.app/v1/graphql \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { redeployService(input: { serviceId: \"3256b012-1e9e-4b8e-a884-b2e42f50e0a9\" }) { id } }"}' \
            || echo "Railway API deploy failed — manual redeploy needed"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        continue-on-error: true
