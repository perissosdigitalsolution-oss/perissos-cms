name: Deploy to Railway

on:
  push:
    branches: [main, sprint/*]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backoffice
        run: |
          docker build -t ghcr.io/perissosdigitalsolution-oss/backoffice:latest -f apps/backoffice/Dockerfile --target runner .
          docker push ghcr.io/perissosdigitalsolution-oss/backoffice:latest
      - name: Install Railway CLI (pinned Rust binary)
        run: |
          curl -fsSL "https://github.com/railwayapp/cli/releases/download/v4.27.5/railway-v4.27.5-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin railway
          railway --version
      - name: Deploy to Railway
        run: railway up --service backoffice --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
