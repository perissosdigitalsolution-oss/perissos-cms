name: Build & Push Backoffice

on:
  push:
    branches: [main, sprint/*]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backoffice
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backoffice/Dockerfile
          push: true
          tags: |
            ghcr.io/perissosdigitalsolution-oss/backoffice:latest
            ghcr.io/perissosdigitalsolution-oss/backoffice:${{ github.sha }}
