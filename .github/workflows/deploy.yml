name: Deploy to Koyeb
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backoffice
        run: |
          docker build -t ghcr.io/perissos/backoffice:latest -f apps/backoffice/Dockerfile --target runner .
          docker push ghcr.io/perissos/backoffice:latest
      - name: Deploy to Koyeb
        run: echo "Deploying to Koyeb..."
      - name: Deploy frontend to Cloudflare
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          projectName: perissos-frontend
          directory: apps/frontend/out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
