name: Deploy to Railway

on:
  push:
    branches: [main, sprint/*]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backoffice
        run: |
          docker build -t ghcr.io/perissosdigitalsolution-oss/backoffice:latest -f apps/backoffice/Dockerfile --target runner .
          docker push ghcr.io/perissosdigitalsolution-oss/backoffice:latest
      - name: Deploy to Railway
        run: |
          pip install railway-cli --quiet 2>/dev/null || npm install -g @railway/cli 2>/dev/null || true
          railway up --service backoffice --environment production --yes 2>&1 || echo "Railway deploy may need manual trigger"
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
