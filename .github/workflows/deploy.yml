name: Deploy to Koyeb
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backoffice
        run: |
          docker build -t ghcr.io/perissos/backoffice:latest -f apps/backoffice/Dockerfile .
          docker push ghcr.io/perissos/backoffice:latest
      - name: Deploy to Koyeb
        run: |
          curl -X POST https://api.koyeb.com/v1/apps \
            -H "Authorization: Bearer ${{ secrets.KOYEB_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"perissos-cms"}'
      - name: Deploy frontend to Cloudflare
        run: |
          npx wrangler pages deploy apps/frontend/out --project-name perissos-frontend
