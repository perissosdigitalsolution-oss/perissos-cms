name: Deploy to Koyeb
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backoffice
        run: |
          docker build -t ghcr.io/perissos/backoffice:latest -f apps/backoffice/Dockerfile --target runner .
          docker push ghcr.io/perissos/backoffice:latest
      - name: Deploy to Koyeb via API
        if: env.KOYEB_API_TOKEN != ''
        env:
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
        run: |
          curl -X POST https://api.koyeb.com/v1/apps \
            -H "Authorization: Bearer $KOYEB_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"perissos-cms"}'
          echo "Deployed to Koyeb"
