name: Deploy to Koyeb
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backoffice
        run: |
          docker build -t ghcr.io/perissos/backoffice:latest -f apps/backoffice/Dockerfile --target runner .
          docker push ghcr.io/perissos/backoffice:latest
      - name: Build and push casdoor
        run: |
          docker build -t ghcr.io/perissos/casdoor:latest -f apps/casdoor/Dockerfile .
          docker push ghcr.io/perissos/casdoor:latest
      - name: Build and push apisix
        run: |
          docker build -t ghcr.io/perissos/apisix:latest -f apps/apisix/Dockerfile .
          docker push ghcr.io/perissos/apisix:latest
      - name: Deploy to Koyeb
        run: |
          echo "Deploying to Koyeb..."
          curl -X POST https://api.koyeb.com/v1/apps \
            -H "Authorization: Bearer ${{ secrets.KOYEB_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"name":"perissos-cms"}' || echo "Koyeb API may need token setup"
      - name: Deploy frontend to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          projectName: perissos-frontend
          directory: apps/frontend/out
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
