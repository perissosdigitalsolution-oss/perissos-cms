# Perissos Accounting Service (Bigcapital)
# Usage: docker compose -f docker-compose.accounting.yml up -d
# Requires: main stack running first (docker compose up -d postgres minio)

services:
  # Bigcapital Server (API)
  perissos-accounting-server:
    image: bigcapitalhq/server:latest
    container_name: perissos-accounting-server
    ports:
      - "${ACCOUNTING_SERVER_PORT:-3200}:3000"
    environment:
      # Database (MariaDB - Bigcapital requirement)
      - DB_HOST=perissos-accounting-mariadb
      - DB_USER=${ACCOUNTING_DB_USER:-perissos_accounting}
      - DB_PASSWORD=${ACCOUNTING_DB_PASSWORD:-perissos_accounting_dev}
      - DB_CHARSET=utf8
      - SYSTEM_DB_NAME=${ACCOUNTING_DB_NAME:-perissos_accounting_system}
      - TENANT_DB_NAME_PERFIX=bigcapital_tenant_

      # Redis
      - REDIS_HOST=perissos-accounting-redis
      - REDIS_PORT=6379
      - QUEUE_HOST=perissos-accounting-redis
      - QUEUE_PORT=6379

      # Auth
      - JWT_SECRET=${ACCOUNTING_JWT_SECRET:-dev-jwt-secret-change-in-prod}
      - APP_JWT_SECRET=${ACCOUNTING_JWT_SECRET:-dev-jwt-secret-change-in-prod}

      # Application
      - BASE_URL=http://localhost:3200
      - SIGNUP_DISABLED=false
      - SIGNUP_ALLOWED_DOMAINS=example.com,perissos.dev
      - SIGNUP_ALLOWED_EMAILS=test@example.com,admin@perissos.dev

      # Gotenberg (PDF generation) - optional for API-only use
      - GOTENBERG_URL=http://perissos-accounting-gotenberg:3000
      - GOTENBERG_DOCS_URL=http://perissos-accounting-server:3000/public/

      # Exchange Rate
      - EXCHANGE_RATE_SERVICE=open-exchange-rate
      - OPEN_EXCHANGE_RATE_APP_ID=

      # S3 (MinIO from main stack)
      - S3_REGION=us-east-1
      - S3_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-perissos}
      - S3_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-perissos_minio_password}
      - S3_ENDPOINT=http://perissos-minio:9000
      - S3_BUCKET=perissos-media

      # Mail (disabled for dev)
      - MAIL_HOST=
      - MAIL_USERNAME=
      - MAIL_PASSWORD=
      - MAIL_PORT=
      - MAIL_SECURE=
      - MAIL_FROM_NAME=Perissos Accounting
      - MAIL_FROM_ADDRESS=noreply@perissos.dev

      # Bank/Stripe/Plaid - disabled for dev
      - PLAID_ENV=sandbox
      - PLAID_CLIENT_ID=
      - PLAID_SECRET=
      - STRIPE_PAYMENT_SECRET_KEY=
      - STRIPE_PAYMENT_PUBLISHABLE_KEY=
      - STRIPE_PAYMENT_WEBHOOKS_SECRET=

      # Rate limiting
      - THROTTLE_GLOBAL_TTL=60000
      - THROTTLE_GLOBAL_LIMIT=300
      - THROTTLE_AUTH_TTL=60000
      - THROTTLE_AUTH_LIMIT=30

    volumes:
      - perissos_accounting_server_data:/app/storage
    networks:
      - perissos-network
    depends_on:
      perissos-accounting-mariadb:
        condition: service_healthy
      perissos-accounting-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/swagger"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # Bigcapital Database Migration
  perissos-accounting-migration:
    image: bigcapitalhq/server:latest
    container_name: perissos-accounting-migration
    command: ["npm", "run", "migrate"]
    environment:
      - DB_HOST=perissos-accounting-mariadb
      - DB_USER=${ACCOUNTING_DB_USER:-perissos_accounting}
      - DB_PASSWORD=${ACCOUNTING_DB_PASSWORD:-perissos_accounting_dev}
      - DB_CHARSET=utf8
      - SYSTEM_DB_NAME=${ACCOUNTING_DB_NAME:-perissos_accounting_system}
      - TENANT_DB_NAME_PERFIX=bigcapital_tenant_
    networks:
      - perissos-network
    depends_on:
      perissos-accounting-mariadb:
        condition: service_healthy
    restart: "no"

  # MariaDB (Bigcapital requirement)
  perissos-accounting-mariadb:
    image: mariadb:11.4
    container_name: perissos-accounting-mariadb
    environment:
      - MYSQL_DATABASE=${ACCOUNTING_DB_NAME:-perissos_accounting_system}
      - MYSQL_USER=${ACCOUNTING_DB_USER:-perissos_accounting}
      - MYSQL_PASSWORD=${ACCOUNTING_DB_PASSWORD:-perissos_accounting_dev}
      - MYSQL_ROOT_PASSWORD=${ACCOUNTING_DB_ROOT_PASSWORD:-perissos_accounting_root}
    ports:
      - "${ACCOUNTING_DB_PORT:-3307}:3306"
    volumes:
      - perissos_accounting_mariadb_data:/var/lib/mysql
    networks:
      - perissos-network
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "${ACCOUNTING_DB_USER:-perissos_accounting}", "-p${ACCOUNTING_DB_PASSWORD:-perissos_accounting_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Redis
  perissos-accounting-redis:
    image: redis:7-alpine
    container_name: perissos-accounting-redis
    command: ["--maxmemory-policy", "noeviction"]
    ports:
      - "${ACCOUNTING_REDIS_PORT:-6383}:6379"
    volumes:
      - perissos_accounting_redis_data:/data
    networks:
      - perissos-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Gotenberg (PDF generation)
  perissos-accounting-gotenberg:
    image: gotenberg/gotenberg:7
    container_name: perissos-accounting-gotenberg
    expose:
      - "3000"
    networks:
      - perissos-network
    restart: unless-stopped

volumes:
  perissos_accounting_server_data:
  perissos_accounting_mariadb_data:
  perissos_accounting_redis_data:

networks:
  perissos-network:
    external: true